<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ehipas — Escrow Flow Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --mono:'DM Mono',monospace;
  --sans:'DM Sans','Noto Sans Thai','Noto Sans SC',sans-serif;
  --r:10px;--rs:6px;
  --hdr-h:45px;
  --teal:#4af7c9;--amber:#f7b74a;--red:#f74a4a;--purple:#9b7ef7;
}
[data-theme="dark"]{
  --bg:#0d0d0b;--bg2:#141412;--bg3:#1c1c19;
  --bd:#2a2a26;--bd2:#3a3a36;
  --tx:#e8e6dc;--tx2:#88887e;--tx3:#555550;
  --crd:#141412;--inp:#1c1c19;
  --acc:#b8f73a;--acc-btn:#b8f73a;--acc-btn-tx:#0d0d0b;
  --acc-dim:rgba(184,247,58,.09);--acc-brd:rgba(184,247,58,.35);
  --shd:0 2px 16px rgba(0,0,0,.55);
  --ok-dim:rgba(74,247,201,.08);--ok-brd:rgba(74,247,201,.3);
  --warn-dim:rgba(247,183,74,.08);--warn-brd:rgba(247,183,74,.3);
  --err-dim:rgba(247,74,74,.08);--err-brd:rgba(247,74,74,.3);
  --pur-dim:rgba(155,126,247,.08);
}
[data-theme="light"]{
  --bg:#f4f3ee;--bg2:#ffffff;--bg3:#eceae2;
  --bd:#dbd9d0;--bd2:#c8c5bc;
  --tx:#1a1a17;--tx2:#5c5c58;--tx3:#99998f;
  --crd:#ffffff;--inp:#eceae2;
  --acc:#2e7d0e;--acc-btn:#5cb82a;--acc-btn-tx:#ffffff;
  --acc-dim:rgba(46,125,14,.07);--acc-brd:rgba(46,125,14,.30);
  --shd:0 2px 16px rgba(0,0,0,.09);
  --ok-dim:rgba(0,130,80,.07);--ok-brd:rgba(0,130,80,.3);
  --warn-dim:rgba(160,100,0,.07);--warn-brd:rgba(160,100,0,.3);
  --err-dim:rgba(180,0,0,.06);--err-brd:rgba(180,0,0,.25);
  --pur-dim:rgba(100,60,200,.07);
}
html,body{width:100%;overflow-x:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5;transition:background .2s,color .2s;padding-top:var(--hdr-h)}
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--hdr-h);border-bottom:1px solid var(--bd);padding:0 14px;display:flex;align-items:center;gap:8px;background:var(--bg)}
.logo{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.1em;color:var(--acc);text-transform:uppercase;flex-shrink:0}
.hdr-title{font-size:11px;color:var(--tx3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-ctrls{display:flex;gap:5px;align-items:center;flex-shrink:0}
.ddwrap{position:relative;display:inline-block}
.ddtrig{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx2);font-family:var(--mono);font-size:11px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:border-color .15s,color .15s}
.ddtrig:hover{border-color:var(--bd2);color:var(--tx)}
.ddarrow{font-size:9px;opacity:.5}
.ddmenu{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--rs);min-width:140px;box-shadow:var(--shd);z-index:300;overflow:hidden}
.ddmenu.open{display:block}
.ddi{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12px;color:var(--tx2);cursor:pointer;transition:background .1s;border-bottom:1px solid var(--bd)}
.ddi:last-child{border-bottom:none}
.ddi:hover{background:var(--bg3);color:var(--tx)}
.ddi.on{color:var(--acc)}
.ddi .ck{font-size:10px;margin-left:auto;color:var(--acc)}
.overlay{display:none;position:fixed;inset:0;z-index:99}
.overlay.on{display:block}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - var(--hdr-h));align-items:start}
@media(max-width:767px){.wrap{grid-template-columns:1fr}}
.sb{border-right:1px solid var(--bd);padding:16px 13px;background:var(--bg);overflow:hidden}
@media(min-width:768px){.sb{position:sticky;top:var(--hdr-h);height:calc(100vh - var(--hdr-h));overflow-y:auto}.sb::-webkit-scrollbar{width:3px}.sb::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}}
@media(max-width:767px){.sb{border-right:none;border-bottom:1px solid var(--bd)}}
.slbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:11px;margin-top:3px}
.ssec{margin-bottom:20px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(min-width:768px){.pgrid{grid-template-columns:1fr}}
.pr{margin-bottom:13px}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.pn{font-size:11px;color:var(--tx2);font-weight:300}
.pv{font-family:var(--mono);font-size:11px;color:var(--acc);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--bd2);border-radius:1px;outline:none;cursor:pointer;display:block}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--acc-btn);border-radius:50%;cursor:pointer;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;background:var(--acc-btn);border-radius:50%;cursor:pointer}
.tgrid{display:grid;grid-template-columns:1fr;gap:5px}
@media(max-width:767px){.tgrid{grid-template-columns:1fr 1fr}}
.ttog{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--bd);border-radius:var(--rs);cursor:pointer;transition:border-color .2s,background .2s;user-select:none;background:var(--inp)}
.ttog:hover{border-color:var(--bd2)}
.ttog.on-ok{border-color:var(--ok-brd);background:var(--ok-dim)}
.ttog.on-warn{border-color:var(--warn-brd);background:var(--warn-dim)}
.ttog.on-err{border-color:var(--err-brd);background:var(--err-dim)}
.ttog input{display:none}
.tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tname{font-size:11px;line-height:1.3}
.rbtn{width:100%;padding:11px;background:var(--acc-btn);color:var(--acc-btn-tx);border:none;border-radius:var(--rs);font-size:13px;font-weight:500;font-family:var(--sans);cursor:pointer;letter-spacing:.02em;transition:opacity .2s,transform .1s;margin-top:4px}
.rbtn:hover{opacity:.88}
.rbtn:active{transform:scale(.98)}
.main{padding:18px 14px;background:var(--bg);min-width:0;overflow:hidden}
@media(min-width:768px){.main{padding:22px 26px}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;color:var(--tx3);text-align:center;gap:10px}
.empty-icon{font-family:var(--mono);font-size:26px;color:var(--bd2)}
.results{display:none;min-width:0}
.results.on{display:block}
.insight{border:1px solid var(--bd);border-left:3px solid var(--purple);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;background:var(--pur-dim)}
.insight-title{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:8px}
.insight-body{font-size:11px;color:var(--tx2);line-height:1.75}
.insight-body strong{color:var(--tx)}
.warn-box{border:1px solid var(--warn-brd);border-left:3px solid var(--amber);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;background:var(--warn-dim);font-size:11px;color:var(--tx2);line-height:1.7}
.warn-box strong{color:var(--tx)}
.warn-icon{color:var(--amber);font-weight:500;margin-right:4px}
.sec-sub{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:12px;margin-top:20px}
.flow{display:flex;flex-direction:column;gap:0;margin-bottom:4px}
.fstep{display:grid;grid-template-columns:90px 1fr;border-left:2px solid var(--bd)}
.fstep.hl-ok{border-left-color:var(--teal)}
.fstep.hl-err{border-left-color:var(--red)}
.fstep.hl-warn{border-left-color:var(--amber)}
.fstep.hl-acc{border-left-color:var(--acc)}
.fstep.hl-pur{border-left-color:var(--purple)}
@media(max-width:500px){.fstep{grid-template-columns:1fr}.ftime{border-right:none;border-bottom:1px solid var(--bd)}}
.ftime{padding:10px 8px 10px 12px;font-family:var(--mono);font-size:10px;color:var(--tx3);border-right:1px solid var(--bd);line-height:1.4}
.fcontent{padding:10px 14px}
.fstep-title{font-size:12px;font-weight:500;margin-bottom:4px}
.fstep-desc{font-size:11px;color:var(--tx2);line-height:1.6}
.ftags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ftag{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid;white-space:nowrap}
.ftag-ok{color:var(--teal);background:var(--ok-dim);border-color:var(--ok-brd)}
.ftag-acc{color:var(--acc);background:var(--acc-dim);border-color:var(--acc-brd)}
.ftag-amber{color:var(--amber);background:var(--warn-dim);border-color:var(--warn-brd)}
.ftag-red{color:var(--red);background:var(--err-dim);border-color:var(--err-brd)}
.ftag-gray{color:var(--tx2);background:var(--bg3);border-color:var(--bd2)}
.ftag-pur{color:var(--purple);background:var(--pur-dim);border-color:rgba(155,126,247,.3)}
.bal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.bal-card{border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;background:var(--crd)}
.bal-card.pos-card{border-color:var(--acc-brd);background:var(--acc-dim)}
.bal-card.neg-card{border-color:var(--err-brd);background:var(--err-dim)}
.bal-card.zero-card{opacity:.6}
.bal-label{font-size:9px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
.bal-name{font-size:12px;font-weight:500;margin-bottom:8px;color:var(--tx)}
.bal-amount{font-family:var(--mono);font-size:14px;font-weight:300;white-space:nowrap}
.bal-amount.pos{color:var(--acc)}
.bal-amount.neg{color:var(--red)}
.bal-amount.zero{color:var(--tx3)}
.concl{border:1px solid var(--bd);border-radius:var(--r);padding:15px 16px;margin-bottom:20px}
.concl.ok{border-left:3px solid var(--teal);background:var(--ok-dim)}
.concl.err{border-left:3px solid var(--red);background:var(--err-dim)}
.concl.warn{border-left:3px solid var(--amber);background:var(--warn-dim)}
.concl-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.concl-title.ok{color:var(--teal)}
.concl-title.err{color:var(--red)}
.concl-title.warn{color:var(--amber)}
.concl-body{font-size:11px;color:var(--tx2);line-height:1.75}
.concl-body strong{color:var(--tx)}
.editions-wrap{margin-bottom:4px}
.edition-block{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.edition-hdr{padding:9px 14px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.edition-hdr-num{font-family:var(--mono);font-size:20px;font-weight:300;opacity:.2;line-height:1}
.edition-hdr-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.edition-hdr-title.ed1{color:var(--amber)}
.edition-hdr-title.ed2{color:var(--purple)}
.edition-body{padding:14px 14px 6px}
.edition-desc{font-size:11px;color:var(--tx2);line-height:1.75;margin-bottom:14px}
.edition-desc strong{color:var(--tx)}
.sub-case{margin-top:4px;margin-bottom:4px}
.sub-case-hdr{display:flex;align-items:center;gap:7px;padding:9px 0 7px;border-top:1px solid var(--bd)}
.sub-case-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sub-case-title{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.sub-case-title.ins-on{color:var(--teal)}
.sub-case-title.ins-off{color:var(--red)}
.sub-case-desc{font-size:11px;color:var(--tx2);line-height:1.65;margin-bottom:10px}
.sub-case-desc strong{color:var(--tx)}
.ftr{border-top:1px solid var(--bd);padding:11px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;background:var(--bg)}
@media(min-width:768px){.ftr{padding:11px 26px}}
.ftr-item{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--tx3);display:flex;align-items:center;gap:5px}
.ftr-item b{color:var(--tx2);font-weight:500}
.ftr-sep{font-size:9px;color:var(--bd2);user-select:none}
.rbtn-sec{width:100%;padding:8px;background:transparent;color:var(--tx3);border:1px solid var(--bd);border-radius:var(--rs);font-size:11px;font-weight:400;font-family:var(--sans);cursor:pointer;letter-spacing:.02em;transition:border-color .15s,color .15s;margin-top:6px}
.rbtn-sec:hover{border-color:var(--bd2);color:var(--tx2)}
.rbtn-sec:active{opacity:.7}
</style>
</head>
<body data-theme="system-placeholder">

<div class="overlay" id="ov" onclick="closeDD()"></div>

<div class="hdr">
  <span class="logo">ehipas</span>
  <span class="hdr-title" data-i="hdr_title">Escrow Flow Simulator</span>
  <div class="hdr-ctrls">
    <div class="ddwrap">
      <button class="ddtrig" onclick="togDD('lang')"><span id="ll">EN</span><span class="ddarrow">&#9662;</span></button>
      <div class="ddmenu" id="lang-dd">
        <div class="ddi on" data-l="en" onclick="setLang('en')">&#127468;&#127463; English<span class="ck" id="lc-en">&#10003;</span></div>
        <div class="ddi" data-l="th" onclick="setLang('th')">&#127481;&#127469; &#3616;&#3634;&#3625;&#3634;&#3652;&#3607;&#3618;<span class="ck" id="lc-th"></span></div>
        <div class="ddi" data-l="zh" onclick="setLang('zh')">&#127464;&#127475; &#20013;&#25991;<span class="ck" id="lc-zh"></span></div>
        <div class="ddi" data-l="ru" onclick="setLang('ru')">&#127479;&#127482; &#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;<span class="ck" id="lc-ru"></span></div>
      </div>
    </div>
    <div class="ddwrap">
      <button class="ddtrig" onclick="togDD('theme')"><span id="ticon">&#8857;</span><span class="ddarrow">&#9662;</span></button>
      <div class="ddmenu" id="theme-dd">
        <div class="ddi on" onclick="setTheme('system')">&#8857; <span data-i="th_sys">System</span><span class="ck" id="tc-sys">&#10003;</span></div>
        <div class="ddi" onclick="setTheme('light')">&#9728; <span data-i="th_light">Light</span><span class="ck" id="tc-light"></span></div>
        <div class="ddi" onclick="setTheme('dark')">&#9790; <span data-i="th_dark">Dark</span><span class="ck" id="tc-dark"></span></div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <aside class="sb">

    <!-- Ticket params -->
    <div class="ssec">
      <div class="slbl" data-i="s_ticket">Ticket params</div>
      <div class="pgrid">
        <div class="pr">
          <div class="ph"><span class="pn" data-i="p_start">Start price (THB)</span><span class="pv" id="v-start">300 THB</span></div>
          <input type="range" min="100" max="1000" step="100" value="300" oninput="upd('start',this.value)">
        </div>
        <div class="pr">
          <div class="ph"><span class="pn" data-i="p_markup">Speculator markup %</span><span class="pv" id="v-markup">20%</span></div>
          <input type="range" min="1" max="100" value="20" oninput="upd('markup',this.value)">
        </div>
        <div class="pr">
          <div class="ph"><span class="pn" data-i="p_resales">Resale rounds</span><span class="pv" id="v-resales">3</span></div>
          <input type="range" min="0" max="10" value="3" oninput="upd('resales',this.value)">
        </div>
      </div>
    </div>

    <!-- Fees -->
    <div class="ssec">
      <div class="slbl" data-i="s_fees">Fees</div>
      <div class="pgrid">
        <div class="pr">
          <div class="ph"><span class="pn" data-i="p_comm">Exchange fee %</span><span class="pv" id="v-comm">10%</span></div>
          <input type="range" min="5" max="20" value="10" oninput="upd('comm',this.value)">
        </div>
        <div class="pr">
          <div class="ph"><span class="pn" data-i="p_roy">Creator royalty %</span><span class="pv" id="v-roy">5%</span></div>
          <input type="range" min="0" max="10" value="5" oninput="upd('roy',this.value)">
        </div>
        <div class="pr">
          <div class="ph"><span class="pn" data-i="p_gateway">Gateway fee %</span><span class="pv" id="v-gwFee">3%</span></div>
          <input type="range" min="0" max="5" step="0.5" value="3" oninput="upd('gwFee',this.value)">
        </div>
      </div>
    </div>

    <!-- Scenario -->
    <div class="ssec">
      <div class="slbl" data-i="s_scenario">Scenario</div>
      <div class="tgrid">
        <label class="ttog on-ok" id="lbl-ok" onclick="setScenario('ok',this)">
          <input type="radio" name="sc" checked>
          <span class="tdot" style="background:var(--teal)"></span>
          <span class="tname" data-i="sc_ok">Success</span>
        </label>
        <label class="ttog" id="lbl-bad" onclick="setScenario('bad',this)">
          <input type="radio" name="sc">
          <span class="tdot" style="background:var(--red)"></span>
          <span class="tname" data-i="sc_bad">Cancel / Complaint</span>
        </label>
      </div>
    </div>

    <button class="rbtn" onclick="run()" data-i="btn_run">Calculate &#8594;</button>
    <button class="rbtn-sec" onclick="reset()" data-i="btn_reset">Reset to defaults</button>

  </aside>

  <main class="main">
    <div class="empty" id="empty">
      <div class="empty-icon">&#8644;</div>
      <div style="font-size:13px;font-weight:300" data-i="empty_lbl">Configure parameters and calculate</div>
    </div>
    <div class="results" id="res"></div>
  </main>
</div>

<footer class="ftr" id="ftr">
  <span class="ftr-item"><b data-i="ftr_ver">v2</b></span>
  <span class="ftr-sep">&#183;</span>
  <span class="ftr-item" data-i="ftr_date">7 May 2026</span>
  <span class="ftr-sep" id="view-sep">&#183;</span>
  <span class="ftr-item" id="view-count"></span>
</footer>

<script data-goatcounter="https://ehipas.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>


<script>
// ═══ I18N ═══════════════════════════════════════════════
const L = {
  en: {
    hdr_title: 'Escrow Flow Simulator',
    s_ticket: 'Ticket params', s_fees: 'Fees', s_scenario: 'Scenario',
    p_start: 'Start price (THB)', p_markup: 'Speculator markup %', p_resales: 'Resale rounds',
    p_comm: 'Exchange fee %', p_roy: 'Creator royalty %', p_gateway: 'Gateway fee %',
    sc_ok: 'Success', sc_bad: 'Cancel / Complaint',
    btn_run: 'Calculate →', btn_reset: 'Reset to defaults',
    empty_lbl: 'Configure parameters and calculate',
    th_sys: 'System', th_light: 'Light', th_dark: 'Dark',
    ftr_ver: 'v2', ftr_date: '7 May 2026',

    insight_title: 'Key architecture decision',
    insight_body: '<strong>Payment gateway escrow.</strong><br>Funds are held in the ticket exchange’s account at the payment gateway. All resales are database ownership changes — no fund movement. Gateway fee (~up to 3%) is charged once at final settlement, borne by the winner.<br><br>On cancellation or complaint — no final settlement. Refund = database reversal. Two editions define who covers the gateway fee in bad scenarios: <strong>Edition 1 — exchange</strong>; <strong>Edition 2 — buyer (optionally insured)</strong>.',

    flow_title: 'Money flow', bal_title: 'Final balances', bal_result: 'Result',
    editions_sec_title: 'Risk management — editions',

    edition1_title: 'Edition 1 — Starting',
    edition1_desc: 'The ticket exchange bears the financial risk (~up to 3%). In case of cancellation or a valid dispute caused by the creator, the exchange covers the payment gateway fee from its own profit. The buyer receives a full refund. Reputational, functional, operational and financial risks automatically transfer to the creator. The creator incurs a debt to the exchange equal to the gateway fee — the next experience can only be listed after the debt is repaid.',

    edition2_title: 'Edition 2 — Development',

    step_resale_title: (n, s, b) => `Перепродажа #${n}: ${s} → ${b}`,
    step_resale_desc: (p) => `Цена: ${p}. Остаётся в эскроу. Смена владельца в БД. Комиссии шлюза нет.`,
    step_settle_title: 'Расчёт через платёжный шлюз',
    step_settle_desc: (g) => `Впечатление прошло. 48ч без жалоб. Средства высвобождены из эскроу. Комиссия шлюза: ${g} — оплачивает победитель.`,
    step_bad_title: '⚠ Создатель виновен — разворот инициирован',
    step_bad_desc: 'Создатель виновен (отмена или обоснованная жалоба). Тикет-биржа инициирует разворот в БД — без движения средств. Каждый получает ровно то, что заплатил.',
    tag_escrow: '→ Эскроу', tag_no_fee: 'Комиссии шлюза нет',
    tag_gateway: 'Перевод через шлюз', tag_creator: 'Создателю', tag_exchange: 'Бирже',
    tag_gateway_fee: 'Комиссия шлюза', tag_refund: 'Возврат',
    warn_spec_loss_title: '⚠ Экономическое примечание',
    warn_spec_loss: (markup, fees) => `При наценке ${markup}% и суммарных комиссиях ${fees}% спекулянты получают убыток с каждой перепродажи. Поднимите наценку выше ${fees}%, чтобы увидеть положительные балансы.`,
    concl_ok: (e, c, g) => `Биржа заработала <strong>${e}</strong>. Создатель получил <strong>${c}</strong> (первичная + роялти). Комиссия шлюза оплачена победителем: <strong>${g}</strong>. Победитель получил впечатление.`,
    concl_bad: 'Все участники получают обратно <strong>ровно то, что заплатили</strong>. Создатель виновен — отмена или обоснованная жалоба. Распределение комиссии шлюза — см. редакции ниже.',
  }
};

let lang = 'en';
const tx = (k, ...a) => {
  const v = L[lang][k] ?? L.en[k] ?? k;
  return typeof v === 'function' ? v(...a) : v;
};

function applyLang() {
  document.querySelectorAll('[data-i]').forEach(el => {
    el.textContent = tx(el.getAttribute('data-i'));
  });
  document.getElementById('ll').textContent = { en:'EN', th:'TH', zh:'中', ru:'RU' }[lang];
  document.documentElement.lang = lang;
  ['en','th','zh','ru'].forEach(l => {
    const ck = document.getElementById('lc-' + l);
    if (ck) ck.textContent = l === lang ? '✓' : '';
    const di = document.querySelector(`[data-l="${l}"]`);
    if (di) di.classList.toggle('on', l === lang);
  });
}

function setLang(l) {
  lang = l;
  localStorage.setItem('ehipas-lang', l);
  closeDD();
  applyLang();
  if (document.getElementById('res').classList.contains('on')) run();
}

// ═══ THEME ═══════════════════════════════════════════════
let theme = 'system';
const TICONS = { system:'⊙', light:'☀', dark:'☾' };

function resolveTheme(t) {
  return t === 'system'
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : t;
}
function applyTheme(t) {
  theme = t;
  document.body.setAttribute('data-theme', resolveTheme(t));
  document.getElementById('ticon').textContent = TICONS[t];
  ['sys','light','dark'].forEach(k => {
    const key = k === 'sys' ? 'system' : k;
    const ck = document.getElementById('tc-' + k);
    if (ck) ck.textContent = t === key ? '✓' : '';
    const di = ck?.closest('.ddi');
    if (di) di.classList.toggle('on', t === key);
  });
}
function setTheme(t) { localStorage.setItem('ehipas-theme', t); closeDD(); applyTheme(t); }

// ═══ DROPDOWN ════════════════════════════════════════════
let openDD = null;
function togDD(id) {
  const m = document.getElementById(id + '-dd');
  if (openDD === id) { closeDD(); return; }
  closeDD();
  m.classList.add('open');
  document.getElementById('ov').classList.add('on');
  openDD = id;
}
function closeDD() {
  document.querySelectorAll('.ddmenu').forEach(m => m.classList.remove('open'));
  document.getElementById('ov').classList.remove('on');
  openDD = null;
}

// ═══ PARAMS ══════════════════════════════════════════════
const DEFAULTS = { start: 300, markup: 20, resales: 3, comm: 10, roy: 5, gwFee: 3 };
const P = { ...DEFAULTS };
let scenario = 'ok';

function upd(k, v) {
  const fv = parseFloat(v);
  const disp = {
    start:  `${fv.toFixed(0)} THB`,
    markup: fv + '%', resales: fv,
    comm:   fv + '%', roy:     fv + '%', gwFee: fv + '%'
  };
  document.getElementById('v-' + k).textContent = disp[k];
  P[k] = fv;
}

function setScenario(s, lbl) {
  scenario = s;
  document.querySelectorAll('.ttog').forEach(t => t.className = t.className.replace(/\bon-\w+/g, ''));
  lbl.classList.add({ ok: 'on-ok', bad: 'on-err' }[s]);
}

function reset() {
  // Reset all sliders and P values to defaults
  Object.entries(DEFAULTS).forEach(([k, v]) => {
    const el = document.querySelector(`input[oninput*="upd('${k}'"]`);
    if (el) { el.value = v; upd(k, v); }
  });
  // Reset scenario to success
  setScenario('ok', document.getElementById('lbl-ok'));
  // Clear results panel
  const res = document.getElementById('res');
  res.classList.remove('on');
  res.innerHTML = '';
  document.getElementById('empty').style.display = '';
}

// ═══ HELPERS ══════════════════════════════════════════════
const fc = n => `${(+n).toFixed(2)}\u00a0THB`;

const specLabel            = n  => tx('lbl_spec', n);
const winnerLabel          = () => tx('lbl_winner');
const creatorLabel         = () => tx('lbl_creator');
const exchangeLabel        = () => tx('lbl_exchange');
const gatewayLabel         = () => tx('lbl_gateway');
const insFundLabel         = () => tx('lbl_ins_fund');
const creatorDebtExchLabel = () => tx('lbl_creator_debt_exch');
const creatorDebtFundLabel = () => tx('lbl_creator_debt_fund');

// ═══ ECONOMIC ENGINE ════════════════════════════════════════
function run() {
  document.getElementById('empty').style.display = 'none';
  const resEl = document.getElementById('res');
  resEl.classList.add('on');

  // ─ Build price chain ─
  const chain = [];
  let price = P.start;

  if (P.resales === 0) {
    chain.push({ round:0, type:'primary',
      seller: creatorLabel(), buyer: winnerLabel(), price });
  } else {
    chain.push({ round:0, type:'primary',
      seller: creatorLabel(), buyer: specLabel(1), price });
    for (let i = 1; i <= P.resales; i++) {
      price = price * (1 + P.markup / 100);
      const isLast = i === P.resales;
      chain.push({ round:i, type:'secondary',
        seller: specLabel(i),
        buyer:  isLast ? winnerLabel() : specLabel(i + 1),
        price, isLast });
    }
  }

  const finalPrice = price;
  const gwFee = finalPrice * P.gwFee / 100;

  // ─ Primary ─
  const primComm      = chain[0].price * P.comm / 100;
  const primToCreator = chain[0].price - primComm;

  // ─ Secondary ─
  const secCalc = chain.slice(1).map(item => {
    const secComm    = item.price * P.comm / 100;
    const secRoy     = item.price * P.roy  / 100;
    const sellerGets = item.price - secComm - secRoy;
    return { ...item, secComm, secRoy, sellerGets };
  });

  const exchTotal    = primComm + secCalc.reduce((s, x) => s + x.secComm, 0);
  const creatorTotal = primToCreator + secCalc.reduce((s, x) => s + x.secRoy, 0);

  // ─ Flow steps ─
  const steps = [];

  steps.push({
    time: 'T0', cls: 'hl-pur',
    title: tx('step_t0_title', chain[0].buyer),
    desc:  tx('step_t0_desc', fc(chain[0].price)),
    tags: [
      { l: fc(chain[0].price),                           c:'ftag-acc'  },
      { l: `${tx('tag_exchange')}: ${fc(primComm)}`,     c:'ftag-ok'   },
      { l: `${tx('tag_creator')}: ${fc(primToCreator)}`, c:'ftag-pur'  },
      { l: tx('tag_escrow'),                             c:'ftag-gray' },
    ]
  });

  secCalc.forEach((s, i) => {
    steps.push({
      time: `T${i+1}`, cls: '',
      title: tx('step_resale_title', i+1, s.seller, s.buyer),
      desc:  tx('step_resale_desc', fc(s.price)),
      tags: [
        { l: fc(s.price),                                c:'ftag-acc'   },
        { l: `${tx('tag_exchange')}: ${fc(s.secComm)}`,  c:'ftag-ok'    },
        { l: `${tx('tag_creator')}: ${fc(s.secRoy)}`,    c:'ftag-pur'   },
        { l: `${fc(s.sellerGets)} \u2192 ${s.seller}`,  c:'ftag-amber' },
        { l: tx('tag_no_fee'),                           c:'ftag-gray'  },
      ]
    });
  });

  // ─ SCENARIO: SUCCESS ─
  if (scenario === 'ok') {

    steps.push({
      time: 'T+48h', cls: 'hl-ok',
      title: tx('step_settle_title'),
      desc:  tx('step_settle_desc', fc(gwFee)),
      tags: [
        { l: `${tx('tag_creator')}: ${fc(creatorTotal)}`, c:'ftag-pur'  },
        { l: `${tx('tag_exchange')}: ${fc(exchTotal)}`,   c:'ftag-ok'   },
        { l: `${tx('tag_gateway_fee')}: ${fc(gwFee)}`,    c:'ftag-gray' },
        { l: tx('tag_gateway'),                           c:'ftag-acc'  },
      ]
    });

    const balances = {};
    balances[exchangeLabel()] = { v: exchTotal };
    balances[creatorLabel()]  = { v: creatorTotal };
    balances[gatewayLabel()]  = { v: gwFee };

    if (P.resales > 0) {
      const specPaid = {}, specReceived = {};
      specPaid[specLabel(1)] = chain[0].price;
      secCalc.forEach(s => {
        specReceived[s.seller] = (specReceived[s.seller] || 0) + s.sellerGets;
        if (!s.isLast) specPaid[s.buyer] = (specPaid[s.buyer] || 0) + s.price;
      });
      for (let i = 1; i <= P.resales; i++) {
        const key = specLabel(i);
        balances[key] = { v: (specReceived[key] || 0) - (specPaid[key] || 0) };
      }
    }

    balances[winnerLabel()] = { v: -(finalPrice + gwFee) };

    const totalFees = P.comm + P.roy;
    const warn = (P.resales > 0 && (1 + P.markup/100) * (1 - totalFees/100) <= 1)
      ? `<div class="warn-box"><span class="warn-icon">${tx('warn_spec_loss_title')}:</span> ${tx('warn_spec_loss', P.markup, totalFees)}</div>`
      : '';

    resEl.innerHTML = renderResult(steps, balances,
      warn +
      `<div class="concl ok"><div class="concl-title ok">${tx('concl_ok_title')}</div><div class="concl-body">${tx('concl_ok', fc(exchTotal), fc(creatorTotal), fc(gwFee))}</div></div>`
    );

  // ─ SCENARIO: BAD (cancel or complaint) ─
  } else {

    steps.push({
      time: '!', cls: 'hl-err',
      title: tx('step_bad_title'),
      desc:  tx('step_bad_desc'),
      tags: [
        { l: tx('tag_no_fee'), c:'ftag-gray' },
        { l: tx('tag_refund'), c:'ftag-ok'   }
      ]
    });

    // Variant B: conclusion first, editions below
    resEl.innerHTML = renderResult(steps, null,
      `<div class="concl err"><div class="concl-title err">${tx('concl_bad_title')}</div><div class="concl-body">${tx('concl_bad')}</div></div>` +
      renderEditions(gwFee)
    );
  }
}

// ═══ RENDER HELPERS ═══════════════════════════════════════════════

function renderBalCards(balances) {
  return Object.entries(balances).map(([name, { v }]) => {
    const isPos  = v >  0.001;
    const isNeg  = v < -0.001;
    const cardCls = isPos ? 'pos-card' : isNeg ? 'neg-card' : 'zero-card';
    const amtCls  = isPos ? 'pos'      : isNeg ? 'neg'      : 'zero';
    const sign    = isPos ? '+' : isNeg ? '−' : '';
    return `<div class="bal-card ${cardCls}">
      <div class="bal-label">${tx('bal_result')}</div>
      <div class="bal-name">${name}</div>
      <div class="bal-amount ${amtCls}">${sign}${fc(Math.abs(v))}</div>
    </div>`;
  }).join('');
}

function renderEditions(gwFee) {
  const specsZero = {};
  for (let i = 1; i <= P.resales; i++) specsZero[specLabel(i)] = { v: 0 };

  const balEd1 = {
    [exchangeLabel()]:        { v: -gwFee },
    [winnerLabel()]:          { v: 0 },
    [gatewayLabel()]:         { v: gwFee },
    [creatorDebtExchLabel()]: { v: -gwFee },
    ...specsZero
  };
  const balEd2Ins = {
    [winnerLabel()]:           { v: 0 },
    [insFundLabel()]:          { v: -gwFee },
    [creatorDebtFundLabel()]:  { v: -gwFee },
    [gatewayLabel()]:          { v: gwFee },
    ...specsZero
  };
  const balEd2NoIns = {
    [winnerLabel()]:           { v: -gwFee },
    [insFundLabel()]:          { v: gwFee },
    [creatorDebtFundLabel()]:  { v: -gwFee },
    [gatewayLabel()]:          { v: gwFee },
    ...specsZero
  };

  return `
    <div class="sec-sub">${tx('editions_sec_title')}</div>
    <div class="editions-wrap">
      <div class="edition-block">
        <div class="edition-hdr">
          <span class="edition-hdr-num">1</span>
          <span class="edition-hdr-title ed1">${tx('edition1_title')}</span>
        </div>
        <div class="edition-body">
          <div class="edition-desc">${tx('edition1_desc')}</div>
          <div class="bal-grid">${renderBalCards(balEd1)}</div>
        </div>
      </div>
      <div class="edition-block">
        <div class="edition-hdr">
          <span class="edition-hdr-num">2</span>
          <span class="edition-hdr-title ed2">${tx('edition2_title')}</span>
        </div>
        <div class="edition-body">
          <div class="edition-desc">${tx('edition2_desc')}</div>
          <div class="sub-case">
            <div class="sub-case-hdr">
              <span class="sub-case-dot" style="background:var(--teal)"></span>
              <span class="sub-case-title ins-on">${tx('sub_with_ins')}</span>
            </div>
            <div class="sub-case-desc">${tx('sub_with_ins_desc')}</div>
            <div class="bal-grid">${renderBalCards(balEd2Ins)}</div>
          </div>
          <div class="sub-case">
            <div class="sub-case-hdr">
              <span class="sub-case-dot" style="background:var(--red)"></span>
              <span class="sub-case-title ins-off">${tx('sub_no_ins')}</span>
            </div>
            <div class="sub-case-desc">${tx('sub_no_ins_desc')}</div>
            <div class="bal-grid">${renderBalCards(balEd2NoIns)}</div>
          </div>
        </div>
      </div>
    </div>`;
}

function renderResult(steps, balances, conclusion) {
  const balSection = balances ? `
    <div class="sec-sub">${tx('bal_title')}</div>
    <div class="bal-grid">${renderBalCards(balances)}</div>` : '';
  return `
    <div class="insight">
      <div class="insight-title">${tx('insight_title')}</div>
      <div class="insight-body">${tx('insight_body')}</div>
    </div>
    <div class="sec-sub">${tx('flow_title')}</div>
    <div class="flow">
      ${steps.map(s => `
        <div class="fstep ${s.cls}">
          <div class="ftime">${s.time}</div>
          <div class="fcontent">
            <div class="fstep-title">${s.title}</div>
            <div class="fstep-desc">${s.desc}</div>
            <div class="ftags">${s.tags.map(t => `<span class="ftag ${t.c}">${t.l}</span>`).join('')}</div>
          </div>
        </div>`).join('')}
    </div>
    ${balSection}
    ${conclusion}`;
}

// ═══ INIT ═════════════════════════════════════════════════════

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (theme === 'system') applyTheme('system');
});

// GoatCounter view counter.
// Public endpoint: /counter/[path].json — no auth required.
// Timeout 3s. On any failure: hide element silently.
(function () {
  const el  = document.getElementById('view-count');
  const sep = document.getElementById('view-sep');
  const hideAll = () => { if (el) el.style.display = 'none'; if (sep) sep.style.display = 'none'; };
  if (!el) return;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3000);

  fetch(
    'https://ehipas.goatcounter.com/counter/' +
    encodeURIComponent(window.location.pathname) + '.json',
    { signal: controller.signal }
  )
  .then(r => { clearTimeout(timer); if (!r.ok) throw new Error(); return r.json(); })
  .then(d => {
    if (d && d.count && d.count !== '0') {
      el.textContent = '👁 ' + d.count;
    } else {
      hideAll();
    }
  })
  .catch(() => { clearTimeout(timer); hideAll(); });
})();

const savedLang  = localStorage.getItem('ehipas-lang')  || 'en';
const savedTheme = localStorage.getItem('ehipas-theme') || 'system';
lang = savedLang;
applyTheme(savedTheme);
applyLang();
</script>
